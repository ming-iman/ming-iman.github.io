<svg xmlns="http://www.w3.org/2000/svg" width="400" height="536" viewBox="0 0 400 536" role="img" aria-labelledby="title desc">
  <title id="title">重试请求的并发竞态</title>
  <desc id="desc">请求 A 和重试 B 使用相同的 requestId。两者在写入结果前都查到不存在，于是分别扣款并创建订单，最后才记录结果。末尾的幂等记录无法撤回已经重复发生的副作用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#6a7c92" stroke-width="1.5"/></marker>
  </defs>
  <rect x=".5" y=".5" width="399" height="535" rx="8" fill="#fff" stroke="#dde2e9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="200" y="35" font-size="17" font-weight="600" fill="#202936">同一个请求标识，两次副作用</text>
    <text x="200" y="62" font-size="13" fill="#616b79">时间从上向下 · 相同 requestId</text>
    <rect x="20" y="87" width="170" height="42" rx="4" fill="#eef2f7"/>
    <rect x="210" y="87" width="170" height="42" rx="4" fill="#eef2f7"/>
    <text x="105" y="114" font-size="16" font-weight="600" fill="#315b8b">请求 A</text>
    <text x="295" y="114" font-size="16" font-weight="600" fill="#315b8b">重试 B</text>
    <g stroke="#6a7c92" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M105 131v28"/><path d="M295 131v28"/>
      <path d="M105 235v32"/><path d="M295 235v32"/>
      <path d="M105 343v32"/><path d="M295 343v32"/>
    </g>
    <g fill="#fff" stroke="#dde2e9">
      <rect x="20" y="163" width="170" height="72" rx="4"/>
      <rect x="210" y="163" width="170" height="72" rx="4"/>
    </g>
    <g font-size="16" font-weight="600" fill="#202936">
      <text x="105" y="191">查询：不存在</text><text x="295" y="191">查询：不存在</text>
    </g>
    <g font-size="13" fill="#616b79">
      <text x="105" y="215">尚未记录请求结果</text><text x="295" y="215">A 尚未写入结果</text>
    </g>
    <g fill="#fbf2eb" stroke="#d6b49a">
      <rect x="20" y="271" width="170" height="72" rx="4"/>
      <rect x="210" y="271" width="170" height="72" rx="4"/>
    </g>
    <g font-size="16" font-weight="600" fill="#80512f">
      <text x="105" y="299">扣款并创建订单</text><text x="295" y="299">扣款并创建订单</text>
    </g>
    <g font-size="13" fill="#80512f">
      <text x="105" y="323">第一次副作用</text><text x="295" y="323">重复的副作用</text>
    </g>
    <g fill="#fff" stroke="#dde2e9">
      <rect x="20" y="379" width="170" height="72" rx="4"/>
      <rect x="210" y="379" width="170" height="72" rx="4"/>
    </g>
    <g font-size="16" font-weight="600" fill="#202936">
      <text x="105" y="407">尝试记录结果</text><text x="295" y="407">尝试记录结果</text>
    </g>
    <g font-size="13" fill="#616b79">
      <text x="105" y="431">副作用已发生</text><text x="295" y="431">副作用已发生</text>
    </g>
    <path d="M30 475h340" stroke="#dde2e9"/>
    <text x="200" y="502" font-size="14" font-weight="600" fill="#80512f">仅在末尾去重，无法阻止重复扣款</text>
  </g>
</svg>
